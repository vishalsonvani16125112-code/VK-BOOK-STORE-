<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Men Collection</title>

<style>
  nav{
    background:#222;
    padding:15px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 15px;
    font-size:18px;
    font-weight:bold;
}

nav a:hover{
    color:#ff4081;
  }
body{
font-family:Arial,sans-serif;
margin:0;
background:#f5f5f5;
}

header{
background:#ff3f6c;
color:white;
padding:15px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 3px 10px rgba(0,0,0,.15);
text-align:center;
}

.card img{
width:100%;
height:260px;
object-fit:cover;
}

.card h3{
margin:10px 0;
}

.card p{
font-size:20px;
font-weight:bold;
color:#ff3f6c;
}

button{
background:#ff3f6c;
color:white;
border:none;
padding:10px 20px;
margin:15px;
cursor:pointer;
border-radius:5px;
}
</style>
</head>

<body>
  
<nav>
    <a href="index.html">Home</a>
    <a href="men.html">Men</a>
    <a href="women.html">Women</a>
    <a href="kids.html">Kids</a>
</nav>
<header>Men Collection</header>

<div class="products">

<div class="card">
<img src="tshirt.jpg">
<h3>Men T-Shirt</h3>
<p>₹499</p>
<button>Add To Cart</button>
</div>

<div class="card">
<img src="shirt.jpg">
<h3>Casual Shirt</h3>
<p>₹799</p>
<button>Add To Cart</button>
</div>

<div class="card">
<img src="hoodie.jpg">
<h3>Hoodie</h3>
<p>₹1199</p>
<button>Add To Cart</button>
</div>

<div class="card">
<img src="jeans.jpg">
<h3>Blue Jeans</h3>
<p>₹999</p>
<button>Add To Cart</button>
</div>

</div>

</body>
</html>
