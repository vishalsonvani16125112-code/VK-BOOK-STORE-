DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Book Store</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f5f5f5;
}
header{
    background:#0d6efd;
    color:white;
    text-align:center;
    padding:20px;
}
.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:20px;
}
.book{
    width:220px;
    background:white;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
    overflow:hidden;
    text-align:center;
}
.book img{
    width:100%;
    height:280px;
    object-fit:cover;
}
.book h3{
    margin:10px;
}
.book p{
    color:green;
    font-size:20px;
    font-weight:bold;
}
button{
    background:#0d6efd;
    color:white;
    border:none;
    padding:10px 20px;
    margin-bottom:15px;
    border-radius:5px;
    cursor:pointer;
}
button:hover{
    background:#084298;
}
footer{
    background:#222;
    color:white;
    text-align:center;
    padding:15px;
}
</style>

</head>
<body>

<header>
<h1>📚 My Book Store</h1>
<p>Best Books at Best Prices</p>
</header>

<div class="container">

<div class="book">
<img src="book1.jpg" alt="Book 1">
<h3>Rich Dad Poor Dad</h3>
<p>₹299</p>
<button>Buy Now</button>
</div>

<div class="book">
<img src="book2.jpg" alt="Book 2">
<h3>Think and Grow Rich</h3>
<p>₹349</p>
<button>Buy Now</button>
</div>

<div class="book">
<img src="book3.jpg" alt="Book 3">
<h3>Atomic Habits</h3>
<p>₹499</p>
<button>Buy Now</button>
</div>

</div>

<footer>
© 2026 My Book Store
</footer>

</body>
	</html>
