<!DOCTYPE html>
<html>
<head>
<title>Order Page</title>

<style>
body{
  font-family: Arial;
  text-align:center;
  background:#f5f5f5;
}

.order-box{
  background:white;
  width:90%;
  max-width:400px;
  margin:30px auto;
  padding:20px;
  border-radius:10px;
}

input, textarea, select{
  width:90%;
  padding:10px;
  margin:10px;
}

button{
  background:black;
  color:white;
  padding:12px 25px;
  border:none;
  border-radius:5px;
}
</style>

</head>

<body>

<h1>Place Your Order</h1>

<div class="order-box">

<h2>Customer Details</h2>

<input type="text" placeholder="Your Name">

<input type="number" placeholder="Mobile Number">

<textarea placeholder="Full Address"></textarea>

<select>
<option>Select Payment Method</option>
<option>Cash On Delivery</option>
<option>Online Payment</option>
</select>

<br>

<button>Place Order</button>

</div>

</body>
</html>
