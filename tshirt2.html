<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black T-Shirt</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.product{
    max-width:450px;
    margin:auto;
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.product img{
    width:100%;
    height:420px;
    object-fit:cover;
}

.content{
    padding:20px;
}

h2{
    margin:0;
    font-size:40px;
}

.price{
    color:#ff3b6c;
    font-size:32px;
    font-weight:bold;
    margin:15px 0;
}

label{
    font-weight:bold;
}

select{
    width:100%;
    padding:12px;
    margin:10px 0 15px;
    font-size:18px;
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#ff3b6c;
    color:#fff;
    font-size:18px;
    cursor:pointer;
}

.back{
    display:block;
    text-align:center;
    margin:20px;
    text-decoration:none;
    color:#ff3b6c;
    font-weight:bold;
}
</style>

</head>

<body>

<div class="product">

<img src="tshirt2.jpg" alt="Black T-Shirt">

<div class="content">

<h2>Black T-Shirt</h2>

<div class="price">₹549</div>

<p><b>Brand:</b> VK Fashion Store</p>
<p><b>Color:</b> Black</p>
<p><b>Fabric:</b> 100% Premium Cotton</p>

<label>Select Size</label>

<select>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>
</select>

<button>Buy Now</button>
<button onclick="location.href='cart.html'">Go To Cart</button>
<button onclick="addToCart()">Add To Cart</button>

</div>

<a href="men.html" class="back">← Back To Men Collection</a>

</div>

<script>
function addToCart(){

let cart=JSON.parse(localStorage.getItem("cart"))||[];

let product={
name:"Black T-Shirt",
price:549,
image:"tshirt2.jpg",
size:document.querySelector("select").value
};

cart.push(product);

localStorage.setItem("cart",JSON.stringify(cart));

alert("Product Added To Cart Successfully!");

}
</script>

</body>
    </html>
