<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black T-Shirt</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.product{
    max-width:500px;
    margin:auto;
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
}

img{
    width:100%;
    height:420px;
    object-fit:cover;
}

.content{
    padding:20px;
}

.price{
    color:#ff3b6c;
    font-size:30px;
    font-weight:bold;
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:none;
    background:#ff3b6c;
    color:#fff;
    font-size:18px;
    border-radius:8px;
}

.back{
    display:block;
    text-align:center;
    margin-top:15px;
    text-decoration:none;
    color:#ff3b6c;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="product">

<img src="tshirt2.jpg" alt="Black T-Shirt">

<div class="content">

<h2>Black T-Shirt</h2>

<p class="price">₹549</p>

<p><b>Color:</b> Black</p>

<p><b>Fabric:</b> 100% Cotton</p>

<p><b>Sizes:</b> S, M, L, XL, XXL</p>

<p><b>Fit:</b> Regular Fit</p>

<p>Soft cotton premium quality T-Shirt for daily wear.</p>

<button>Buy Now</button>

<button onclick="addToCart()">Add To Cart</button>

<a href="men.html" class="back">⬅ Back to Men Collection</a>

</div>

</div>
<script>
function addToCart() {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  let product = {
    name: "Black T-Shirt",
    price: 499,
    image: "tshirt2.jpg",
    size: document.querySelector("select").value
  }; 

  cart.push(product);

  localStorage.setItem("cart", JSON.stringify(cart));

  alert("Product Added To Cart Successfully!");
}
</script>
</body>
</html>
