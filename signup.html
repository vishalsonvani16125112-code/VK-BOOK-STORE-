<!DOCTYPE html>
<html>
<head>
<title>Signup - VK Fashion Store</title>

<style>
body{
font-family:Arial;
background:#f5f5f5;
text-align:center;
}

.signup-box{
background:white;
width:90%;
max-width:350px;
margin:50px auto;
padding:20px;
border-radius:10px;
}

input{
width:90%;
padding:10px;
margin:10px;
}

button{
background:black;
color:white;
padding:10px 25px;
border:none;
border-radius:5px;
}
</style>

</head>

<body>

<h1>VK Fashion Store</h1>

<div class="signup-box">

<h2>Signup</h2>

<input type="text" id="name" placeholder="Full Name">

<input type="email" id="email" placeholder="Email">
  
<input type="text" id="mobile" placeholder="Mobile Number">

<input type="text" id="address" placeholder="Address">

<input type="text" id="city" placeholder="City">

<input type="text" id="state" placeholder="State">

<input type="text" id="pincode" placeholder="PIN Code">

<input type="password" id="password" placeholder="Password">

<br>

<button onclick="signup()">Create Account</button>

<p>
Already User?
<a href="login.html">Login</a>
</p>

</div>


<script>

<script type="module">

import { auth } from "./firebase.js";
import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

window.signup = function(){

let name = document.getElementById("name").value;
let mobile = document.getElementById("mobile").value;
let email = document.getElementById("email").value;
let address = document.getElementById("address").value;
let city = document.getElementById("city").value;
let state = document.getElementById("state").value;
let pincode = document.getElementById("pincode").value;
let password = document.getElementById("password").value;


createUserWithEmailAndPassword(auth, email, password)

.then((userCredential)=>{

let user = {
name,
mobile,
email,
address,
city,
state,
pincode
};

localStorage.setItem("user", JSON.stringify(user));

alert("Signup Successful!");

window.location.href="login.html";

})

.catch((error)=>{

alert(error.message);

});

}

</script>

</body>
</html>
