<!DOCTYPE html>
<html>
<head>
<title>VK Fashion Admin Panel</title>

<style>
body{
  font-family: Arial;
  background:#f5f5f5;
  text-align:center;
}

.order{
  background:white;
  width:90%;
  max-width:500px;
  margin:20px auto;
  padding:15px;
  border-radius:10px;
  box-shadow:0 0 5px #aaa;
}

h1{
  color:#333;
}
</style>

</head>

<body>

<h1>VK Fashion Admin Panel</h1>

<div id="orders">
Loading Orders...
</div>


<script type="module">

import { auth, db } from "./firebase.js";


import { 
onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
collection,
getDocs,
query,
orderBy,
doc,
updateDoc
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const ordersDiv = document.getElementById("orders");



onAuthStateChanged(auth, async (user)=>{


if(!user){

alert("Please Login First");

window.location.href="login.html";

return;

}


// ADMIN CHECK

if(user.email !== "admin@vkfashion.com"){

alert("Access Denied");

window.location.href="index.html";

return;

}



// LOAD ALL ORDERS


try{


const q = query(
collection(db,"orders"),
orderBy("createdAt","desc")
);


const snapshot = await getDocs(q);


ordersDiv.innerHTML="";


if(snapshot.empty){

ordersDiv.innerHTML="No Orders Found";

return;

}



snapshot.forEach((doc)=>{


let order = doc.data();


ordersDiv.innerHTML += `

<div class="order">

<h3>Order</h3>

<p><b>Name:</b> ${order.name}</p>

<p><b>Mobile:</b> ${order.mobile}</p>

<p><b>Email:</b> ${order.userEmail}</p>

<p><b>Address:</b> ${order.address}</p>

<p><b>City:</b> ${order.city}</p>

<p><b>State:</b> ${order.state}</p>

<p><b>Pincode:</b> ${order.pincode}</p>

<p><b>Payment:</b> ${order.payment}</p>

<p>
<b>Status:</b>
<select onchange="updateStatus('${doc.id}', this.value)">
<option value="Pending" ${order.status=="Pending"?"selected":""}>Pending</option>
<option value="Shipped" ${order.status=="Shipped"?"selected":""}>Shipped</option>
<option value="Delivered" ${order.status=="Delivered"?"selected":""}>Delivered</option>
</select>
</p>

</div>

`;


});


}
catch(error){

alert(error.message);

}


});


</script>


</body>
</html>
