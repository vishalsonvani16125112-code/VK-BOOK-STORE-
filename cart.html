<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart - VK Fashion Store</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    padding:20px;
}

h1{
    text-align:center;
    color:#ff3b6c;
    margin-bottom:25px;
}

#cart-items{
    max-width:900px;
    margin:auto;
}

.cart-item{
    display:flex;
    align-items:center;
    background:#fff;
    margin-bottom:15px;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.cart-item img{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:8px;
    margin-right:20px;
}

.details{
    flex:1;
}

.details h3{
    margin-bottom:10px;
}

.details p{
    margin:5px 0;
}

.remove-btn{
    background:red;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:6px;
    cursor:pointer;
}

#total{
    max-width:900px;
    margin:20px auto;
    text-align:right;
    font-size:24px;
    font-weight:bold;
}

.buttons{
    max-width:900px;
    margin:auto;
    display:flex;
    justify-content:space-between;
}

.buttons a,
.buttons button{
    background:#ff3b6c;
    color:white;
    text-decoration:none;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

.empty{
    text-align:center;
    font-size:22px;
    margin-top:40px;
}
</style>

</head>

<body>

<h1>🛒 Shopping Cart</h1>

<div id="cart-items"></div>

<div id="total"></div>

<div class="buttons">
    <a href="men.html">← Continue Shopping</a>
    <button onclick="clearCart()">Clear Cart</button>
</div>
<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let cartItems = document.getElementById("cart-items");
let total = 0;

function displayCart() {

    cartItems.innerHTML = "";

    if(cart.length === 0){
        cartItems.innerHTML = "<p class='empty'>Your Cart is Empty</p>";
        document.getElementById("total").innerHTML = "";
        return;
    }

    cart.forEach((item,index)=>{

        total += item.price;

        cartItems.innerHTML += `
        <div class="cart-item">
            <img src="${item.image}">
            <div class="details">
                <h3>${item.name}</h3>
                <p>Price : ₹${item.price}</p>
                <p>Size : ${item.size}</p>
            </div>

            <button class="remove-btn" onclick="removeItem(${index})">
                Remove
            </button>

        </div>
        `;
    });

    document.getElementById("total").innerHTML =
    "Total : ₹" + total;
}

function removeItem(index){

    cart.splice(index,1);

    localStorage.setItem("cart",JSON.stringify(cart));

    location.reload();

}

function clearCart(){

    localStorage.removeItem("cart");

    location.reload();

}

displayCart();
</script>

</body>
</html>
