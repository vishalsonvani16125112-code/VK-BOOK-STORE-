<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Men T-Shirt</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
    text-align:center;
}

.card{
    max-width:400px;
    margin:auto;
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,.2);
}

.card img{
    width:100%;
    height:400px;
    object-fit:cover;
}

h1{
    margin:15px 0;
}

.price{
    color:#ff3b6c;
    font-size:32px;
    font-weight:bold;
}

button{
    width:90%;
    padding:15px;
    margin:10px;
    border:none;
    border-radius:8px;
    background:#ff3b6c;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.back{
    display:inline-block;
    margin:15px;
    text-decoration:none;
    color:#ff3b6c;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
    <img src="tshirt.jpg" alt="Men T-Shirt">

    <h1>Men T-Shirt</h1>

    <div class="price">₹499</div>

    <p><b>Color:</b> Maroon</p>
    <p><b>Sizes:</b> S, M, L, XL</p>
    <p>Premium Cotton T-Shirt. Soft, Comfortable and Stylish.</p>

    <button>Buy Now</button>

    <button>Add To Cart</button>

    <a href="index.html" class="back">⬅ Back to Home</a>

</div>

</body>
</html>
