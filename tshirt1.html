<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Blue T-Shirt</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}
.card{
    max-width:450px;
    margin:auto;
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.2);
}
.card img{
    width:100%;
    height:420px;
    object-fit:cover;
}
.content{
    padding:20px;
}
h1{
    margin:0;
}
.price{
    color:#ff3f6c;
    font-size:32px;
    font-weight:bold;
    margin:15px 0;
}
label{
    font-weight:bold;
}
select{
    width:100%;
    padding:10px;
    margin:8px 0 15px;
}
button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#ff3f6c;
    color:#fff;
    font-size:18px;
}
.back{
    display:block;
    text-align:center;
    margin:20px;
    text-decoration:none;
    font-weight:bold;
    color:#ff3f6c;
}
</style>
</head>

<body>

<div class="card">

<img src="tshirt1.jpg" alt="Sky Blue T-Shirt">

<div class="content">

<h1>Sky Blue T-Shirt</h1>

<div class="price">₹499</div>

<p><b>Brand:</b> VK Fashion Store</p>
<p><b>Color:</b> Sky Blue</p>
<p><b>Fabric:</b> Premium Cotton</p>

<label>Select Size</label>
<select>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
</select>

<button>Buy Now</button>
<button onclick="addToCart()">Add To Cart</button>

</div>

<a href="index.html" class="back">⬅ Back to Home</a>

</div>

</body>
</html>
