<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Men T-Shirts</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:20px;
    background:#f5f5f5;
}

h1{
    text-align:center;
}
 
.products{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}
}

.card{
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
    text-decoration:none;
    color:black;
}

.card img{
    width:100%;
    height:260px;
    object-fit:cover;
}

.card h3{
    margin:8px;
    font-size:18px;
}

.card p{
    margin:8px;
    font-size:15px;
}
</style>

</head>

<body>

<h1>Men T-Shirts</h1>

<div class="products">

<a href="tshirt1.html" class="card">
<img src="tshirt1.jpg" alt="">
<h3>Sky Blue T-Shirt</h3>
<p>₹499</p>
</a>

<a href="tshirt2.html" class="card">
<img src="tshirt2.jpg" alt="">
<h3>Black T-Shirt</h3>
<p>₹549</p>
</a>

<a href="tshirt3.html" class="card">
<img src="tshirt3.jpg" alt="">
<h3>Blue T-Shirt</h3>
<p>₹599</p>
</a>

</div>

</body>
</html>
