
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Men T-Shirts</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:20px;
}

.products{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.card{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

.card img{
    width:100%;
    height:260px;
    object-fit:cover;
}

.card h3{
    font-size:20px;
}

.card p{
    font-size:16px;
}
</style>

</head>
<body>

<div class="products">

<div class="card">
<img src="tshirt1.jpg" alt="Sky Blue T-Shirt">
<h3>Sky Blue T-Shirt</h3>
<p>Colour: Sky Blue</p>
<p>Size: S, M, L, XL</p>
<p>Price: ₹499</p>
</div>

<div class="card">
<img src="tshirt2.jpg" alt="Black T-Shirt">
<h3>Black T-Shirt</h3>
<p>Colour: Black</p>
<p>Size: M, L, XL</p>
<p>Price: ₹549</p>
</div>

</div>

</body>
</html>
