<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist - VK Fashion Store</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:20px;
}

h1{
text-align:center;
color:#ff3b6c;
margin-bottom:25px;
}

#wishlist-items{
max-width:900px;
margin:auto;
}

.wishlist-item{
display:flex;
align-items:center;
background:#fff;
margin-bottom:15px;
padding:15px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.wishlist-item img{
width:120px;
height:120px;
object-fit:cover;
border-radius:8px;
margin-right:20px;
}

.details{
flex:1;
}

.details h3{
margin-bottom:10px;
}

.details p{
margin:5px 0;
}

.remove-btn{
background:red;
color:white;
border:none;
padding:10px 15px;
border-radius:6px;
cursor:pointer;
}

.buttons{
max-width:900px;
margin:20px auto;
display:flex;
justify-content:space-between;
}

.buttons a,
.buttons button{
background:#ff3b6c;
color:white;
text-decoration:none;
border:none;
padding:12px 20px;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

.empty{
text-align:center;
font-size:22px;
margin-top:40px;
}

</style>

</head>

<body>

<h1>❤️ My Wishlist</h1>

<div id="wishlist-items"></div>

<div class="buttons">
<a href="men.html">← Continue Shopping</a>
<button onclick="clearWishlist()">Clear Wishlist</button>
  </div>
<script>

let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
let wishlistItems = document.getElementById("wishlist-items");

function displayWishlist(){

wishlistItems.innerHTML="";

if(wishlist.length===0){
wishlistItems.innerHTML="<p class='empty'>Your Wishlist is Empty</p>";
return;
}

wishlist.forEach((item,index)=>{

wishlistItems.innerHTML += `
<div class="wishlist-item">

<img src="${item.image}">

<div class="details">

<h3>${item.name}</h3>

<p>Price : ₹${item.price}</p>

<p>Size : ${item.size}</p>

</div>

<button class="remove-btn" onclick="removeItem(${index})">
Remove
</button>

</div>
`;

});

}

function removeItem(index){

wishlist.splice(index,1);

localStorage.setItem("wishlist",JSON.stringify(wishlist));

location.reload();

}

function clearWishlist(){

localStorage.removeItem("wishlist");

location.reload();

}

displayWishlist();

</script>

</body>
</html>
